    <rect x="1288" y="465" width="21" height="25" rx="8" fill="#2d5016" opacity="0.13" transform="rotate(22, 655, 349)"/>
    <rect x="1198" y="21" width="70" height="22" rx="8" fill="#2d5016" opacity="0.08" transform="rotate(29, 268, 210)"/>
    <rect x="1139" y="697" width="85" height="89" rx="8" fill="#2d5016" opacity="0.07" transform="rotate(43, 279, -81)"/>
    <rect x="1298" y="300" width="87" height="69" rx="8" fill="#2d5016" opacity="0.11" transform="rotate(31, 662, 720)"/>
    <polygon points="890,-89 978,87 802,87" fill="#1a3a0a" opacity="0.07"/>
    <polygon points="432,149 512,309 352,309" fill="#1a3a0a" opacity="0.04"/>
    <polygon points="766,-144 841,6 691,6" fill="#1a3a0a" opacity="0.03"/>
    <polygon points="1131,681 1168,755 1094,755" fill="#1a3a0a" opacity="0.11"/>

  <!-- Wave at bottom -->
  <path d="M0,562 C360,596 840,528 1200,562 L1200,630 L0,630Z" fill="#1a3a0a" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
